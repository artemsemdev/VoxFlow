name: VoxFlow
options:
  bundleIdPrefix: dev.artemsem
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    # Signing lives in Signing.xcconfig (ad-hoc by default; Local.xcconfig overrides it on a
    # developer's Mac — see SETUP.md). Developer ID signing is configured in phase 7.
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  VoxFlowKit:
    path: VoxFlowKit
targets:
  VoxFlow:
    type: application
    platform: macOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: VoxFlow
    dependencies:
      - package: VoxFlowKit
        product: VoxFlowCore
      - package: VoxFlowKit
        product: VoxFlowAudio
      - package: VoxFlowKit
        product: VoxFlowSpeech
      - package: VoxFlowKit
        product: VoxFlowModels
      - package: VoxFlowKit
        product: VoxFlowFiles
      - package: VoxFlowKit
        product: VoxFlowDictation
      - package: VoxFlowKit
        product: VoxFlowStorage
      - package: VoxFlowKit
        product: VoxFlowStyling
    info:
      path: VoxFlow/Info.plist
      properties:
        CFBundleDisplayName: VoxFlow
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "© 2026 Artem Semenov"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSMicrophoneUsageDescription: "VoxFlow listens only while you hold fn. Audio never leaves this Mac."
        NSContactsUsageDescription: "VoxFlow reads first and last names from Contacts so it spells them right. Nothing is uploaded."
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio or video
            LSItemContentTypes:
              - public.audio
              - public.movie
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.artemsem.voxflow
        SWIFT_EMIT_LOC_STRINGS: YES
  VoxFlowTests:
    type: bundle.unit-test
    platform: macOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: VoxFlowTests
    dependencies:
      - target: VoxFlow
      - package: VoxFlowKit
        product: VoxFlowCore
      - package: VoxFlowKit
        product: VoxFlowAudio
      - package: VoxFlowKit
        product: VoxFlowSpeech
      - package: VoxFlowKit
        product: VoxFlowModels
      - package: VoxFlowKit
        product: VoxFlowFiles
      - package: VoxFlowKit
        product: VoxFlowDictation
      - package: VoxFlowKit
        product: VoxFlowStorage
      - package: VoxFlowKit
        product: VoxFlowStyling
      - package: VoxFlowKit
        product: VoxFlowTestSupport
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  VoxFlow:
    build:
      targets:
        VoxFlow: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - VoxFlowTests
        - package: VoxFlowKit/VoxFlowCoreTests
        - package: VoxFlowKit/VoxFlowAudioTests
        - package: VoxFlowKit/VoxFlowSpeechTests
        - package: VoxFlowKit/VoxFlowModelsTests
        - package: VoxFlowKit/VoxFlowFilesTests
        - package: VoxFlowKit/VoxFlowDictationTests
        - package: VoxFlowKit/VoxFlowStorageTests
        - package: VoxFlowKit/VoxFlowStylingTests
        - package: VoxFlowKit/VoxFlowMCPTests
