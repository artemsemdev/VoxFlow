name: CodeQL v2

# CodeQL for the v2 Swift rewrite under v2/ (see issue #105).
# CodeQL supports Swift only on macOS runners, hence macos-15 rather than ubuntu-latest.
# Runs on pushes to develop/master, weekly, and on demand — not on every PR (a full Swift analysis takes ~25 minutes).
on:
  push:
    branches:
      - master
      - develop
    paths:
      - 'v2/**'
      - '.github/workflows/codeql-v2.yml'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: codeql-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Swift
    runs-on: macos-15
    timeout-minutes: 45

    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: ['swift']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The weekly schedule fires on master, which has no v2/ until promotion; skip until it does.
      - name: Probe for Swift sources
        id: probe
        run: |
          if [ -n "$(find v2 -name '*.swift' -print -quit 2>/dev/null)" ]; then
            echo "has_swift=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_swift=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Swift sources under v2/ on this ref; skipping CodeQL Swift analysis."
          fi

      - name: Select Xcode 26
        if: steps.probe.outputs.has_swift == 'true'
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          [ -n "$XCODE" ] || { echo "::error::No Xcode 26.x on this runner image"; exit 1; }
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        if: steps.probe.outputs.has_swift == 'true'
        run: brew install xcodegen

      - name: Initialize CodeQL
        if: steps.probe.outputs.has_swift == 'true'
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Build
        if: steps.probe.outputs.has_swift == 'true'
        working-directory: v2
        run: |
          xcodegen generate
          xcodebuild -scheme VoxFlow -destination 'platform=macOS' build
          # The app links only VoxFlowCore; build the whole package so CodeQL traces all nine modules.
          swift build --package-path VoxFlowKit

      - name: Perform CodeQL Analysis
        if: steps.probe.outputs.has_swift == 'true'
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
