name: CI v2

# Validate the v2 native Swift rewrite under v2/ (see issues #105, #116).
#
# Ladder (pull requests): a cheap Ubuntu job buckets the changed files, then
#   docs only                                   → nothing else runs, `result` is green
#   v2/scripts/** only                          → Python unit tests for the CI scripts
#   VoxFlowKit only (modules the app does not link) → swift test for the changed modules and their dependents
#   app, project.yml, this workflow, the package manifest, a module the app links,
#   anything else under v2/, or PR label `ci:full`   → full VoxFlow scheme (build + all tests)
# Pushes to develop/master and manual runs always run the full scheme.
# Every PR gets a `result` check; branch protection requires only that job.
on:
  push:
    branches:
      - master
      - develop
    paths:
      - 'v2/**'
      - '.github/workflows/ci-v2.yml'
  pull_request:
    # `labeled` so adding `ci:full` to an open PR triggers a full run.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

concurrency:
  group: ci-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  PACKAGE_PATH: v2/VoxFlowKit

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scripts: ${{ steps.filter.outputs.scripts }}
      package: ${{ steps.filter.outputs.package }}
      package_files: ${{ steps.filter.outputs.package_files }}
      full: ${{ steps.mode.outputs.full }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Only pull requests are classified; pushes and manual runs always run everything.
      - name: Bucket changed files
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          list-files: json
          # Default quantifier ('some') matches a rule if ANY of its patterns match, so a
          # negated pattern such as '!v2/**/*.md' does not act as an exclusion once 'v2/**'
          # already matched — 'other' would wrongly catch every v2/*.md file. This makes a
          # negated pattern a real exclusion.
          predicate-quantifier: 'some-with-excludes'
          filters: |
            docs:
              - 'v2/docs/**'
              - 'v2/design/**'
              - 'v2/**/*.md'
            scripts:
              - 'v2/scripts/**'
            package:
              - 'v2/VoxFlowKit/**'
            app:
              - 'v2/VoxFlow/**'
              - 'v2/VoxFlowTests/**'
              - 'v2/project.yml'
            workflow:
              - '.github/workflows/ci-v2.yml'
            # Anything else under v2/ (a new package, an .xcconfig, a Makefile…) runs everything.
            other:
              - 'v2/**'
              - '!v2/docs/**'
              - '!v2/design/**'
              - '!v2/**/*.md'
              - '!v2/scripts/**'
              - '!v2/VoxFlowKit/**'
              - '!v2/VoxFlow/**'
              - '!v2/VoxFlowTests/**'
              - '!v2/project.yml'

      # A package change that touches the manifest or a module the app links must also
      # build the app, so it escalates to the full run. Linked modules are read from
      # project.yml (`product:` lines), not maintained by hand.
      - name: Check whether package changes reach the app
        id: linked
        if: github.event_name == 'pull_request' && steps.filter.outputs.package == 'true'
        env:
          PACKAGE_FILES: ${{ steps.filter.outputs.package_files }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          files = json.loads(os.environ["PACKAGE_FILES"])
          linked = sorted(set(re.findall(r"^\s*product:\s*(\S+)\s*$", open("v2/project.yml").read(), re.M)))
          prefixes = tuple(f"v2/VoxFlowKit/Sources/{m}/" for m in linked)
          reaches_app = any(
              f.rsplit("/", 1)[-1] in ("Package.swift", "Package.resolved") or f.startswith(prefixes)
              for f in files
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"reaches_app={'true' if reaches_app else 'false'}\n")
          print(f"::notice::App-linked modules: {linked}; package change reaches the app: {reaches_app}")
          PY

      # Full run when: not a PR (push/dispatch), the PR carries `ci:full`, or the change
      # touches the app, this workflow, an unbucketed v2 path, or a package part the app links.
      - name: Decide run mode
        id: mode
        env:
          IS_PR: ${{ github.event_name == 'pull_request' }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
          APP: ${{ steps.filter.outputs.app }}
          WORKFLOW: ${{ steps.filter.outputs.workflow }}
          OTHER: ${{ steps.filter.outputs.other }}
          REACHES_APP: ${{ steps.linked.outputs.reaches_app }}
        run: |
          set -euo pipefail
          if [ "$IS_PR" != "true" ] || [ "$HAS_LABEL" = "true" ] || [ "$APP" = "true" ] \
             || [ "$WORKFLOW" = "true" ] || [ "$OTHER" = "true" ] || [ "$REACHES_APP" = "true" ]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Run mode: full (pr=$IS_PR label=$HAS_LABEL app=$APP workflow=$WORKFLOW other=$OTHER reaches_app=${REACHES_APP:-false})"
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Run mode: selective"
          fi

  script-tests:
    name: CI script tests
    needs: changes
    if: needs.changes.outputs.scripts == 'true' || needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run unit tests
        run: python3 -m unittest discover -s v2/scripts/tests -v

  package-tests:
    name: Package tests (affected modules)
    needs: changes
    if: needs.changes.outputs.full != 'true' && needs.changes.outputs.package == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          [ -n "$XCODE" ] || { echo "::error::No Xcode 26.x on this runner image"; exit 1; }
          sudo xcode-select -s "$XCODE"
          swift --version

      - name: Cache SPM build
        uses: actions/cache@v4
        with:
          path: v2/VoxFlowKit/.build
          key: ${{ runner.os }}-spm-build-${{ hashFiles('v2/VoxFlowKit/Package.swift', 'v2/**/Package.resolved') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-spm-build-${{ hashFiles('v2/VoxFlowKit/Package.swift', 'v2/**/Package.resolved') }}-
            ${{ runner.os }}-spm-build-

      - name: Select affected test targets
        id: select
        env:
          CHANGED_JSON: ${{ needs.changes.outputs.package_files }}
        run: |
          set -euo pipefail
          printf '%s' "$CHANGED_JSON" > changed-files.json
          FILTER=$(python3 v2/scripts/affected_tests.py --package-path "$PACKAGE_PATH" --format regex --files-json changed-files.json)
          {
            echo "filter<<VOXFLOW_EOF"
            echo "$FILTER"
            echo "VOXFLOW_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::Test filter: ${FILTER:-<none>}"

      - name: Build package
        run: swift build --package-path "$PACKAGE_PATH"

      - name: Test affected modules
        env:
          FILTER: ${{ steps.select.outputs.filter }}
        run: |
          set -euo pipefail
          if [ -z "$FILTER" ]; then
            echo "No test target is affected by the changed files."
          elif [ "$FILTER" = "ALL" ]; then
            swift test --package-path "$PACKAGE_PATH"
          else
            swift test --package-path "$PACKAGE_PATH" --filter "$FILTER" 2>&1 | tee package-test.log
            # A filter that selects nothing exits 0; treat that as a broken filter, not a pass.
            if grep -q "Test run with 0 tests" package-test.log; then
              echo "::error::The filter '$FILTER' selected no tests; target names or the filter format changed."
              exit 1
            fi
          fi

  full:
    name: Build & test (Swift)
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: macos-15
    timeout-minutes: 30

    defaults:
      run:
        working-directory: v2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The image defaults to Xcode 16.x; v2 is developed with Xcode 26.x. Pick the newest 26.
      - name: Select Xcode 26
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          [ -n "$XCODE" ] || { echo "::error::No Xcode 26.x on this runner image"; exit 1; }
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Cache SPM packages and DerivedData
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            v2/VoxFlowKit/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('v2/VoxFlowKit/Package.swift', 'v2/**/Package.resolved') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-spm-${{ hashFiles('v2/VoxFlowKit/Package.swift', 'v2/**/Package.resolved') }}-
            ${{ runner.os }}-spm-

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild -scheme VoxFlow -destination 'platform=macOS' build | tee build.log

      - name: Test
        run: |
          set -o pipefail
          xcodebuild -scheme VoxFlow -destination 'platform=macOS' test -resultBundlePath TestResults.xcresult | tee test.log

      - name: Package tests without Xcode project
        run: swift test
        working-directory: v2/VoxFlowKit

      - name: Upload logs and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-test-results
          path: |
            v2/build.log
            v2/test.log
            v2/TestResults.xcresult
          if-no-files-found: ignore

  # The single status check for branch protection: red if any job that ran failed or was
  # cancelled, green when jobs were skipped by the ladder. `!cancelled()` (not `always()`)
  # so a run superseded by a newer push posts no result at all instead of a stale red one.
  result:
    name: result
    needs: [changes, script-tests, package-tests, full]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Evaluate
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS" | python3 -c '
          import json, sys
          needs = json.load(sys.stdin)
          bad = {k: v["result"] for k, v in needs.items() if v["result"] in ("failure", "cancelled")}
          for k, v in needs.items():
              print(k, ":", v["result"])
          sys.exit(1 if bad else 0)
          '
